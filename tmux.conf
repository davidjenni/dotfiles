# vim: set ft=tmux:
# tmux configuration compatible for tmux on linux/macOS/wsl and psmux on windows
# - https://github.com/tmux/tmux
# - https://github.com/psmux/psmux

set -g mouse on
set -g focus-events on          # send to e.g. vim

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on      # Automatically renumber windows when one is closed
set -g history-limit 1000000    # increase history size (from 2,000)
set -g renumber-windows on      # renumber all windows when any window is closed
set -g set-clipboard on         # use system clipboard
set -g status-position top      # macOS style
# set -g detach-on-destroy off    # Don't exit from tmux when closing a session
set -g escape-time 0            # Remove delay for exiting insert mode with ESC in Neovim
set -g history-limit 1000000    # Increase history size (from 2,000)
set -g allow-passthrough on     # Allow programs in the pane to bypass tmux (e.g. for image preview)
set -g set-titles on            # Update terminal title
set -g display-time 5000        # Time in msec to show messages
# not in psmux yet
# set -g pane-border-indicators arrows

# use vim keys to move around in copy mode
setw -g mode-keys vi

unbind r
%if "#{==:#{OS},Windows_NT}"
  set -g default-shell pwsh
  set -g default-terminal 'xterm-256color'
  %hidden conf_file="~/.config/psmux/psmux.conf"
%else
  # set -g default-terminal "${TERM}"
  set -g default-terminal "tmux-256color"
  %hidden conf_file="~/.tmux.conf"
%endif
set -ga terminal-overrides ',*256col:RGB'
bind r source-file ${conf_file} \; display-message -d 4000 '>> tmux config reloaded.'

# Set prefix key; C-e is convenient for Enthium layout, and tolerable for qwerty
# C-Space is unreliable in WindowsTerminal
unbind C-b              # Unbind the default prefix key
set -g prefix C-e   # Set new prefix key to Ctrl+Space
bind C-e send-prefix

# Split vertically in CWD with -
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Split horizontally in CWD with |
unbind %
bind | split-window -h -c "#{pane_current_path}"

# New window in same path
bind c new-window -c "#{pane_current_path}"
# Prompt to rename window right after it's created
set-hook -g after-new-window 'command-prompt -I "#{window_name}" "rename-window '%%'"'

bind X confirm-before -p 'Kill current window #W (Y/n)?' kill-window
# bind C-x confirm-before -p "kill other windows? (y/n)" "kill-window -a"
bind Q confirm-before -p "kill-session #S? (y/n)" kill-session

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5
bind -r M-h resize-pane -L 5
# Use m key to maximize pane
bind -r M-m resize-pane -Z

unbind Space
bind Space last-window

bind C copy-mode
# Start selecting text with "v"
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
# Copy text with "y"
bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "pbcopy"
# Paste yanked text with "Prefix + P" ("Prefix + p" goes to previous window)
bind P paste-buffer

# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

%hidden theme="circadia-dark-modern"
# %hidden theme="circadia-dark-focus"


# https://tanmaymanojgandhi.github.io/circadia/
%if "#{==:#{theme},circadia-light-warm}"
  # light - warm parchment:
  %hidden bg_canvas="#f7f2e6"
  %hidden bg_surface="#eee7d6"
  %hidden bg_element="#e5dcc6"
  %hidden border="#43505c"
  %hidden text_primary="#28323a"
  %hidden text_muted="#46535f"
  %hidden text_faint="#91887d"
  %hidden accent="#0048b3"
  %hidden function="#7a1f7a"
  # actual: tag
  %hidden emphasis="#005f2f"
%elif "#{==:#{theme},circadia-dark-classic}"
  # dark classic / warm candlelight:
  %hidden bg_canvas="#17130f"
  %hidden bg_surface="#1e1a15"
  %hidden bg_element="#29241e"
  %hidden border="#3b342b"
  %hidden text_primary="#c9c0b1"
  %hidden text_muted="#aba195"
  %hidden text_faint="#91887d"
  %hidden accent="#e89a49"
  %hidden function="#b991db"
  # actual: tag
  %hidden emphasis="#66abc6"
%elif "#{==:#{theme},circadia-dark-modern}"
  # dark modern / plum noir:
  %hidden bg_canvas="#140e12"
  %hidden bg_surface="#1b1419"
  %hidden bg_element="#261e23"
  %hidden border="#3d3039"
  %hidden text_primary="#d8c8d2"
  %hidden text_muted="#b4a3af"
  %hidden text_faint="#9a8b96"
  %hidden accent="#cf8aa4"
  %hidden function="#b29ace"
  # # actual: tag
  %hidden emphasis="#75acd2"
%elif "#{==:#{theme},circadia-dark-focus}"
  # dark focus / obsidian pine:
  %hidden bg_canvas="#131714"
  %hidden bg_surface="#1a1e1b"
  %hidden bg_element="#242a25"
  %hidden border="#353c36"
  %hidden text_primary="#c4ccc5"
  %hidden text_muted="#9fa9a1"
  %hidden text_faint="#838d85"
  %hidden accent="#83b384"
  %hidden function="#b29ace"
  %hidden emphasis="#6cb0c5"
%else
  # ensure default theme colors
  # BUG: variable aren't set on first psmux ?
  %hidden bg_canvas="#17130f"
  %hidden bg_surface="#1e1a15"
  %hidden bg_element="#29241e"
  %hidden border="#3b342b"
  %hidden text_primary="#c9c0b1"
  %hidden text_muted="#aba195"
  %hidden text_faint="#91887d"
  %hidden accent="#e89a49"
  %hidden function="#b991db"
  %hidden emphasis="#66abc6"
%endif

# Status bar
# '\uE0B6':
%hidden half_round_open=""
# %hidden half_round_close=""
# '\uE0B4':
%hidden half_round_close=""
set -g status-style "bg=${bg_surface},fg=${text_primary}"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#{?client_prefix,#[fg=${emphasis}],#[fg=${function}]}#[bg=${bg_canvas},bold]${half_round_open}#{?client_prefix,#[bg=${emphasis}],#[bg=${function}]}#[fg=${bg_canvas},bold] #S #[bg=${bg_surface},fg=${accent}]"
set -g status-right "#[bg=${bg_element},fg=${text_muted}]  %Y-%m-%d #[fg=${text_faint}]|#[fg=${text_primary},bold] %H:%M #[bg=${function},fg=${bg_canvas},bold]  #h "

# Window status
%if "#{==:#{OS},Windows_NT}"
  # BUG: in psmux, pane_current_path doesn't work with starship, always shows system path
  set -g window-status-format "#[bg=${bg_surface},fg=${text_muted}]  #I:#W#{?window_last_flag, 󰑆,}  "
  set -g window-status-current-format "#[fg=${bg_element},bg=${accent},bold]  #I:#W#{?window_zoomed_flag,()} #[bg=${bg_element},fg=${accent},bold]${half_round_close}"
%else
  set -g window-status-format "#[bg=${bg_surface},fg=${text_muted}]  #I:#{=|-16|...:pane_current_path}#{?window_last_flag, 󰑆,}  "
  set -g window-status-current-format "#[fg=${bg_element},bg=${accent},bold]  #I:#{=|-16|...:pane_current_path}#{?window_zoomed_flag,(),} #[bg=${bg_element},fg=${accent},bold]${half_round_close}"
%endif
set -g window-status-separator ""

# Panes
set -g pane-border-style "fg=${border}"
set -g pane-active-border-style "fg=${accent}"

# Messages / Command prompt
set -g message-style "bg=${bg_element},fg=${text_primary},bold"
set -g message-command-style "bg=${bg_element},fg=${text_primary}"

# Mode / Copy mode selection
set -g mode-style "bg={$bg_element},fg=${accent},bold"

# Clock mode
set -g clock-mode-colour "${accent}"

unbind C-g
bind C-g display-popup \
  -d "#{pane_current_path}" \
  -w 80% -h 80% \
  -E "lazygit"

unbind C-t
bind C-t display-popup \
  -d "#{pane_current_path}" \
  -w 80% -h 80% \
  -E "btop"
